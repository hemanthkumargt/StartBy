# HTTP-only on purpose. `certbot --nginx -d <your domain>` (README-deploy.md,
# step 6) rewrites this file itself: it adds the 443 server block, the
# certificate paths and the http->https redirect. A hand-written 443 block
# here would reference certificates that do not exist yet and stop nginx from
# starting at all.
#
# deploy/setup.sh replaces YOUR_SUBDOMAIN.duckdns.org with $DOMAIN when set.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_SUBDOMAIN.duckdns.org;

    # Matches the app's MAX_CONTENT_LENGTH (6 MB) so an oversized upload gets
    # the app's JSON error rather than nginx's HTML 413 page.
    client_max_body_size 6M;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json
               application/manifest+json image/svg+xml;
    gzip_min_length 512;

    location /static/ {
        alias /opt/startby/app/static/;
        # Short on purpose: the JS modules import each other by plain URL (no ?v=),
        # so a long cache would keep a visited browser on old code after a fix.
        expires 5m;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        # Just above gunicorn's 60 s --timeout, so nginx never gives up first.
        proxy_read_timeout 65s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
