# Replace YOUR_SUBDOMAIN.duckdns.org with your real DuckDNS name throughout.
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/startby
#          sudo ln -sf /etc/nginx/sites-available/startby /etc/nginx/sites-enabled/startby
# certbot (see deploy/README-deploy.md) fills in the ssl_certificate lines below
# the first time it runs --- don't hand-edit those paths before then.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_SUBDOMAIN.duckdns.org;

    # certbot's http-01 challenge needs plain HTTP to still work here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name YOUR_SUBDOMAIN.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/YOUR_SUBDOMAIN.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_SUBDOMAIN.duckdns.org/privkey.pem;

    client_max_body_size 5M;

    location /static/ {
        alias /opt/startby/app/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
