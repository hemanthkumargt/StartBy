name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          # Matches the VM's Ubuntu 22.04 Python exactly (CLAUDE.md overrides
          # the PRD's "3.11+" for this reason) so CI catches anything that
          # only works on a newer interpreter before it reaches the VM.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node 20 (for the front-end unit tests)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test (pytest, with coverage)
        run: pytest --cov=app --cov-report=term-missing

      - name: Test (front-end modules, node --test)
        run: node --test tests/js/*.test.mjs
