<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b21b6">
  <title>Offline — Cloud 6</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #0b1020; color: #e8ecf5; }
    main { max-width: 26rem; text-align: center; }
    h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
    p { color: #a9b2c7; line-height: 1.5; }
    button { margin-top: 1rem; min-height: 44px; padding: 0 1.4rem; border: 0; border-radius: 10px;
      background: #5b21b6; color: #fff; font: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Cloud 6 needs a connection to show your tasks — they're kept private on the server,
       not stored on this device. Reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
