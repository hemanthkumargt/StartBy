<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}StartBy{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <header class="app-header">
    <a class="app-header__brand" href="{{ url_for('pages.home_page') }}">StartBy</a>
    {% if current_user.is_authenticated %}
    <nav class="app-header__nav">
      <a href="{{ url_for('pages.home_page') }}">Dashboard</a>
      <a href="{{ url_for('pages.tasks_page') }}">Tasks</a>
      <a href="{{ url_for('pages.activity_page') }}">Activity</a>
      <span class="app-header__user">{{ current_user.name }}</span>
      <button id="logout-btn" type="button">Log out</button>
    </nav>
    {% endif %}
  </header>
  <main class="app-main">
    {% block content %}{% endblock %}
  </main>
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>
  <script type="module" src="{{ url_for('static', filename='js/api.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
