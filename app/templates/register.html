{% extends "base.html" %}
{% block title %}Register — StartBy{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Create your account</h1>
  <form id="register-form" novalidate>
    <label for="name">Name</label>
    <input id="name" name="name" type="text" required maxlength="200" autocomplete="name">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="email">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">

    <p id="form-error" class="form-error" role="alert" hidden></p>

    <button type="submit">Register</button>
  </form>
  <p>Already have an account? <a href="{{ url_for('pages.login_page') }}">Log in</a></p>
</section>
{% endblock %}
{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
